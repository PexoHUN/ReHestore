<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReHestore</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <header>
      <img class="logo" src="../icons/128.png" alt="">
      <div>
        <strong>ReHestore</strong>
        <span>modern felület a hestore.hu-hoz</span>
      </div>
    </header>
    <label class="row">
      <span>Modern nézet</span>
      <span class="switch"><input type="checkbox" id="enabled" checked /><i></i></span>
    </label>
    <p class="hint">Kikapcsolva az eredeti HESTORE felület látszik. A nyitott hestore.hu lap újratöltődik.</p>

    <div class="row col">
      <span>Téma</span>
      <div class="seg" id="theme" role="radiogroup" aria-label="Téma">
        <button type="button" data-theme="light" role="radio" aria-checked="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          Világos
        </button>
        <button type="button" data-theme="dark" role="radio" aria-checked="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          Sötét
        </button>
        <button type="button" data-theme="auto" role="radio" aria-checked="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Rendszer
        </button>
      </div>
    </div>
    <p class="hint">A téma azonnal vált a nyitott hestore.hu lapon is.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
